<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="build" content="__BUILD_SHA__" />
    <title>sched-prod · incidents</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>incidents</h1>
      <p class="sub">sched-prod · tonight · <span class="status" aria-live="polite"></span></p>
    </header>
    <main data-testid="board" aria-busy="true">
      <div data-testid="loader" class="loader" role="status">Loading incidents…</div>
      <p data-testid="empty" class="empty" hidden>No incidents tonight.</p>
      <ul data-testid="incident-list" class="list" hidden></ul>
    </main>
    <div data-testid="confirm" class="confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" hidden>
      <div class="confirm-card">
        <h2 id="confirm-title">Ack this incident?</h2>
        <p class="confirm-text"></p>
        <div class="confirm-actions">
          <button type="button" data-testid="confirm-cancel">Cancel</button>
          <button type="button" data-testid="confirm-ack" class="primary">Ack</button>
        </div>
      </div>
    </div>
    <footer>sched-prod incident board · build <code data-testid="build-sha">__BUILD_SHA__</code></footer>
  </body>
</html>
